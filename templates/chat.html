{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">AI Health Assistant</h1>
    <div class="btn-group">
        <button class="btn btn-outline-primary" onclick="newConversation()">New Chat</button>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-header">
                <h5 class="mb-0">Conversations</h5>
            </div>
            <div class="card-body p-0" id="conversations-list">
                <div class="text-center text-muted py-4">Loading...</div>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card h-100 d-flex flex-column">
            <div class="card-header">
                <h5 class="mb-0" id="chat-title">Select a conversation</h5>
            </div>
            <div class="card-body flex-grow-1 d-flex flex-column" id="chat-area">
                <div class="flex-grow-1 overflow-auto" id="messages">
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-chat-dots fs-1"></i>
                        <p class="mt-2">Select a conversation or start a new one</p>
                    </div>
                </div>
                <form id="chat-form" class="mt-3" style="display: none;">
                    <div class="input-group">
                        <input type="text" class="form-control" id="message-input" placeholder="Ask about your medical records..." required>
                        <button class="btn btn-primary" type="submit">Send</button>
                    </div>
                    <div class="form-text">Answers are based only on your confirmed medical records.</div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = '/login';
    
    let currentConversationId = null;
    
    async function fetchAPI(endpoint, options = {}) {
        const response = await fetch(endpoint, {
            ...options,
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
            }
        });
        if (!response.ok) {
            const err = await response.json().catch(() => ({detail: 'Request failed'}));
            throw new Error(err.detail || 'Request failed');
        }
        return response.json();
    }
    
    async function loadConversations() {
        try {
            const conversations = await fetchAPI('/api/chat/conversations');
            renderConversations(conversations);
        } catch (err) {
            document.getElementById('conversations-list').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
        }
    }
    
    function renderConversations(conversations) {
        const container = document.getElementById('conversations-list');
        if (conversations.length === 0) {
            container.innerHTML = '<div class="p-3 text-center text-muted">No conversations yet</div>';
            return;
        }
        container.innerHTML = conversations.map(c => `
            <div class="p-3 border-bottom conversation-item ${c.id === currentConversationId ? 'bg-light' : ''}" 
                 onclick="loadConversation(${c.id})" style="cursor: pointer;">
                <strong>${c.title || 'Untitled'}</strong>
                <br><small class="text-muted">${new Date(c.updated_at).toLocaleString()}</small>
            </div>
        `).join('');
    }
    
    async function loadConversation(conversationId) {
        try {
            currentConversationId = conversationId;
            const conv = await fetchAPI(`/api/chat/conversations/${conversationId}`);
            const messages = await fetchAPI(`/api/chat/conversations/${conversationId}/messages`);
            
            document.getElementById('chat-title').textContent = conv.title || 'Conversation';
            document.getElementById('chat-form').style.display = 'block';
            renderMessages(messages);
            renderConversations((await fetchAPI('/api/chat/conversations')));
        } catch (err) {
            alert('Failed to load conversation: ' + err.message);
        }
    }
    
    function renderMessages(messages) {
        const container = document.getElementById('messages');
        if (messages.length === 0) {
            container.innerHTML = '<div class="text-center text-muted py-5">No messages yet. Start the conversation!</div>';
            return;
        }
        container.innerHTML = messages.map(m => `
            <div class="mb-3 ${m.role === 'user' ? 'text-end' : ''}">
                <div class="d-inline-block p-3 rounded ${m.role === 'user' ? 'bg-primary text-white' : 'bg-light'}" style="max-width: 80%;">
                    ${m.content}
                    ${m.sources && m.sources.length > 0 ? `
                        <div class="mt-2 small opacity-75">
                            <strong>Sources:</strong>
                            <ul class="mb-0 mt-1">
                                ${m.sources.map(s => `<li>${s.fact_type}: ${s.value} (Page ${s.page})</li>`).join('')}
                            </ul>
                        </div>
                    ` : ''}
                </div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }
    
    function newConversation() {
        currentConversationId = null;
        document.getElementById('chat-title').textContent = 'New Conversation';
        document.getElementById('chat-form').style.display = 'block';
        document.getElementById('messages').innerHTML = '<div class="text-center text-muted py-5">Start a new conversation</div>';
        renderConversations((await fetchAPI('/api/chat/conversations')));
    }
    
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('message-input');
        const message = input.value.trim();
        if (!message) return;
        
        input.value = '';
        input.disabled = true;
        
        addMessage(message, 'user');
        
        try {
            const response = await fetchAPI('/api/chat', {
                method: 'POST',
                body: JSON.stringify({message, conversation_id: currentConversationId})
            });
            
            currentConversationId = response.conversation_id;
            addMessage(response.response, 'assistant', response.sources);
            loadConversations();
        } catch (err) {
            addMessage('Error: ' + err.message, 'assistant');
        } finally {
            input.disabled = false;
            input.focus();
        }
    });
    
    function addMessage(content, role, sources = null) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `mb-3 ${role === 'user' ? 'text-end' : ''}`;
        div.innerHTML = `
            <div class="d-inline-block p-3 rounded ${role === 'user' ? 'bg-primary text-white' : 'bg-light'}" style="max-width: 80%;">
                ${content}
                ${sources && sources.length > 0 ? `
                    <div class="mt-2 small opacity-75">
                        <strong>Sources:</strong>
                        <ul class="mb-0 mt-1">
                            ${sources.map(s => `<li>${s.fact_type}: ${s.value} (Page ${s.page})</li>`).join('')}
                        </ul>
                    </div>
                ` : ''}
            </div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
    
    loadConversations();
</script>
{% endblock %}
